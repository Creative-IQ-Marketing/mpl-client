<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#001a4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#002266;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a832;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c84a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Decorative shapes -->
  <circle cx="1100" cy="80" r="320" fill="#4475b5" opacity="0.10" />
  <circle cx="200" cy="580" r="220" fill="#4475b5" opacity="0.07" />
  <!-- Gold accent bar -->
  <rect x="80" y="200" width="5" height="230" fill="url(#accent)" rx="2" />
  <!-- Firm name -->
  <text x="110" y="250" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#c9a832" letter-spacing="4">MORALES PADIA LAW</text>
  <!-- Main headline -->
  <text x="110" y="318" font-family="Georgia, serif" font-size="60" font-weight="700" fill="#ffffff">Estate Planning</text>
  <text x="110" y="385" font-family="Georgia, serif" font-size="60" font-weight="700" fill="#ffffff">&amp; Probate</text>
  <!-- Subheadline -->
  <text x="110" y="430" font-family="Georgia, serif" font-size="30" font-weight="400" fill="#a8bcd4">Attorney in San Antonio, TX</text>
  <!-- Description -->
  <text x="110" y="473" font-family="Arial, sans-serif" font-size="21" fill="#7a9bc0">Wills · Trusts · Power of Attorney · Probate Administration</text>
  <!-- Divider -->
  <rect x="110" y="498" width="980" height="1" fill="#4475b5" opacity="0.4" />
  <!-- Footer -->
  <text x="110" y="532" font-family="Arial, sans-serif" font-size="20" fill="#5a7a9e">moralespadialaw.com</text>
  <text x="980" y="532" font-family="Arial, sans-serif" font-size="20" fill="#5a7a9e" text-anchor="end">(726) 204-4044</text>
</svg>
