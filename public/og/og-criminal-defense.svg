<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c9a832;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8c84a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <!-- Decorative circles -->
  <circle cx="1080" cy="100" r="300" fill="#4475b5" opacity="0.08" />
  <circle cx="150" cy="550" r="180" fill="#c9a832" opacity="0.05" />
  <!-- Gold accent bar -->
  <rect x="80" y="200" width="5" height="230" fill="url(#accent)" rx="2" />
  <!-- Firm name -->
  <text x="110" y="250" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#c9a832" letter-spacing="4">MORALES PADIA LAW</text>
  <!-- Main headline -->
  <text x="110" y="330" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#ffffff">Criminal Defense</text>
  <!-- Subheadline -->
  <text x="110" y="390" font-family="Georgia, serif" font-size="36" font-weight="400" fill="#9aacbf">Attorney in San Antonio</text>
  <!-- Description -->
  <text x="110" y="445" font-family="Arial, sans-serif" font-size="22" fill="#6a8aa8">DWI · Drug Charges · Felony · Expungement</text>
  <!-- Divider -->
  <rect x="110" y="475" width="980" height="1" fill="#4475b5" opacity="0.4" />
  <!-- Footer -->
  <text x="110" y="510" font-family="Arial, sans-serif" font-size="20" fill="#4a6a8e">moralespadialaw.com</text>
  <text x="980" y="510" font-family="Arial, sans-serif" font-size="20" fill="#4a6a8e" text-anchor="end">(726) 204-4044</text>
</svg>
